services:
  db:
    image: postgres:16-alpine
    container_name: trycore-evm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evm}
      POSTGRES_DB: ${POSTGRES_DB:-evm}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - evm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evm-data:
